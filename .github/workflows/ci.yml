name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile-check Python modules
        run: python -m py_compile *.py vendor/headlinearena/ha.py
      - name: Run pytest
        run: pytest tests/ -q

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend dependencies
        working-directory: gui/backend
        run: npm ci
      - name: Run Jest tests
        working-directory: gui/backend
        run: npm test
      - name: Run standalone Node validation tests
        run: |
          node tests/cors_logic_test.js
          node tests/order_validation_test.js

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: gui/frontend
        run: npm install --legacy-peer-deps
      - name: Typecheck frontend
        working-directory: gui/frontend
        run: npx tsc --noEmit
      - name: Lint frontend
        working-directory: gui/frontend
        run: npm run lint
      - name: Build frontend
        working-directory: gui/frontend
        run: npm run build

  docker-compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
